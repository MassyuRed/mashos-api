permissions:
  contents: read

jobs:
  observed-content:
    if: github.repository == 'MassyuRed/mashos-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .:ai/services:ai/services/ai_inference:ai/tests
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated-test dependencies
        run: >-
          python -m pip install --quiet --disable-pip-version-check
          pytest==8.4.1 pytest-subtests==0.14.2 pytest-asyncio==1.2.0
          fastapi==0.142.2 pydantic==2.13.5 httpx==0.28.1 PyJWT==2.13.0 tornado==6.5.2
      - name: Record tested source and runtime
        run: |
          git rev-parse HEAD
          python --version
          python -m pip freeze
      - name: Verify input-based live Kokoro weather and saved compatibility
        run: >-
          python -m pytest -q --tb=short -ra
          -p pytest_subtests.plugin -p pytest_asyncio.plugin -p no:cacheprovider -c /dev/null --rootdir=. --noconftest
          ai/tests/test_kokoro_weather_live.py
          ai/tests/test_kokoro_weather_service.py
          ai/tests/test_kokoro_weather_phase6_qa.py
          ai/tests/test_analysis_home_summary_current_weather.py
          ai/tests/test_analysis_report_kokoro_weather.py
          ai/tests/test_analysis_material_input_integrity.py
          ai/tests/contract/test_api_contract_registry.py
      - name: Verify notification candidate retries and async Emlis delivery
        run: >-
          python -m pytest -q --tb=short -ra
          -p pytest_subtests.plugin -p no:cacheprovider -c /dev/null --rootdir=. --noconftest
          ai/tests/test_notification_candidate_read_retry.py
          ai/tests/test_emotion_submit_pending_delivery.py
          ai/tests/test_emotion_submit_public_feedback_meta_boundary.py
          ai/tests/test_analysis_jupyter_bridge.py
      - name: Verify Analysis generation and saved read
        run: >-
          python -m pytest -q --tb=short -ra
          -p pytest_subtests.plugin -p no:cacheprovider -c /dev/null --rootdir=. --noconftest
          ai/tests/test_cmee_analysis_v1d_vertical.py
          ai/tests/test_cmee_analysis_input_fields.py
          ai/tests/test_input_contract_sample_sheet.py
          ai/tests/test_analysis_semantic_map.py
          ai/tests/test_emlis_natural_reply_probe_http.py
          ai/tests/test_analysis_closed_quote_self_action.py
          ai/tests/test_analysis_model_role_clause.py
          ai/tests/test_analysis_model_observed_actions.py
          ai/tests/test_analysis_model_supplement_wish.py
          ai/tests/test_analysis_model_observed_roles.py
          ai/tests/test_analysis_model_same_field_role_action.py
          ai/tests/test_analysis_model_role_decision.py
          ai/tests/test_analysis_model_actor_profile.py
          ai/tests/test_analysis_model_omitted_wish.py
          ai/tests/test_analysis_model_refusal.py
          ai/tests/test_analysis_model_closed_role.py
          ai/tests/test_analysis_model_role_action.py
          ai/tests/test_analysis_model_quoted_parent_units.py
          ai/tests/test_analysis_model_parent_local_content.py
          ai/tests/test_analysis_model_units.py
          ai/tests/test_cmee_analysis_nominal_relations.py
          ai/tests/test_analysis_observed_storage.py
          ai/tests/test_analysis_saved_period.py
          ai/tests/test_cmee_emlis_limited_change_feeling.py
      - name: Verify shared owner identity
        env:
          PYTHONPATH: ai/services/ai_inference:ai/tests:ai
        run: >-
          python -m pytest -q --tb=short -ra
          -p pytest_subtests.plugin -p no:cacheprovider -c /dev/null --rootdir=. --noconftest
          ai/tests/test_cmee_v1a_i1sx_contracts.py
          -k test_active_final_language_owner_chain_has_zero_legacy_compose_calls
      - name: Read synthetic Analysis content
        run: |
          python - <<'PY'
          from test_cmee_analysis_v1d_vertical import OWNER, record, request
          from cocolon_meaning_experience_engine.engine import MeaningExperienceEngine
          cases = (
              '私は資料を調べた。その後、私は同僚と分担を決めませんでした。それから、私は安心した。',
              '私は資料を調べた。その後、私は同僚と分担を決めておきませんでした。それから、私は安心した。',
              '私は同僚との分担を決めませんでした。それから、私は嬉しかった。',
              '私は資料を調べた。その後、私は分担を決めませんでした。不明な出来事があった。それから、私は安心した。',
              '私は資料を調べた。その後、私は同僚と分担を決めませんでした。それから、私は落ち着きました。',
              '私は資料を調べた。その後、私は同僚と分担を決めておきませんでした。それから、私は嬉しかったです。',
              '私は同僚との分担を決めなかったです。それから、私はうれしかったです。',
          )
          for memo in cases:
              result = MeaningExperienceEngine().generate(request(record(memo=memo)))
              assert result.artifact is not None
              print('INPUT:', memo)
              print(result.artifact.safe_text_projection(authenticated_owner_scope=OWNER)['text'])
              projection = result.artifact.safe_projection(authenticated_owner_scope=OWNER)
              print('GRAPH:', len(projection['nodes']), 'nodes', len(projection['edges']), 'edges')
          PY

      - name: Set up Node for existing PostgreSQL test harness
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install PostgreSQL WASM test dependency
        run: npm install --prefix "$RUNNER_TEMP/analysis-postgres" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify cumulative API, Q3 saved sources and existing job entrypoints
        env:
          Q2_PGLITE_MODULE: ${{ runner.temp }}/analysis-postgres/node_modules/@electric-sql/pglite
        run: >-
          python -m pytest -q --tb=short -ra
          -p pytest_subtests.plugin -p pytest_asyncio.plugin -p no:cacheprovider -c /dev/null --rootdir=. --noconftest
          ai/tests/test_emotion_submit_speed_regression_phase14.py
          ai/tests/test_cmee_piece_refined_sources.py
          ai/tests/test_cmee_piece_refined_feeling_accounts.py
          ai/tests/piece_v2/test_b08_refined_engine_result_binding.py
          ai/tests/piece_v2/test_b05a_piece_refined_source_handoff.py
          ai/tests/piece_v2/test_b05c_refined_source_ref_projection.py
          ai/tests/piece_v2/test_b05_refined_preview_services.py
          ai/tests/piece_v2/test_b05_refined_preview_saved_pipeline.py
          ai/tests/piece_v2/test_b05_natural_refined_saved_pipeline.py
          ai/tests/piece_v2/test_b05_refined_source_fence_sql.py
          ai/tests/test_emlis_natural_reply_application.py
          ai/tests/test_emlis_natural_frames_application.py
          ai/tests/test_emlis_frame_feedback_context.py
          ai/tests/test_emlis_interpretation_correction.py
          ai/tests/test_emlis_natural_question_application.py
          ai/tests/test_emlis_natural_reply_response_purpose.py
          ai/tests/test_emlis_natural_reply_meaning_reuse.py
          ai/tests/test_emlis_natural_reply_meaning_budget.py
          ai/tests/test_emlis_natural_reply_cognition.py
          ai/tests/test_analysis_model_fields.py
          ai/tests/test_analysis_cumulative.py
          ai/tests/test_analysis_interpretation_correction_sources.py
          ai/tests/test_analysis_cumulative_model_source.py
          ai/tests/test_analysis_semantic_integration.py
          ai/tests/test_analysis_semantic_source_duties.py
          ai/tests/test_analysis_cumulative_model_batches.py
          ai/tests/test_analysis_cumulative_jobs.py
          ai/tests/test_analysis_observed_api.py
      - name: Verify monthly rank, immutable re-read and source deletion SQL
        env:
          NODE_PATH: ${{ runner.temp }}/analysis-postgres/node_modules
        run: |
          python - <<'PY'
          import json, os
          from test_analysis_cumulative import sql_fixture
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'analysis-cumulative.json'), 'w') as out:
              json.dump(sql_fixture(), out, ensure_ascii=False)
          PY
          node ai/tests/analysis_cumulative_sql.cjs "$RUNNER_TEMP/analysis-cumulative.json"
      - name: Verify report facts, complete input sources and safe legacy recovery
        env:
          Q2_PGLITE_MODULE: ${{ runner.temp }}/analysis-postgres/node_modules/@electric-sql/pglite
        run: >-
          python -m pytest -q --tb=short -ra
          -p pytest_subtests.plugin -p pytest_asyncio.plugin -p no:cacheprovider
          -c /dev/null --rootdir=. --noconftest
          ai/tests/test_analysis_snapshot_factual_binding.py
          ai/tests/test_analysis_global_material_pagination.py
          ai/tests/test_analysis_daily_rows_factual_binding.py
          ai/tests/test_analysis_ensure_alignment_recovery.py
          ai/tests/test_analysis_report_factual_sections.py
          ai/tests/test_analysis_material_input_integrity.py
          ai/tests/test_analysis_parallel_emotion_chronology.py
          ai/tests/test_analysis_legacy_report_source_integrity.py
          ai/tests/test_analysis_report_kokoro_weather.py
          ai/tests/test_cocolon_text_generation_core_analysis_input_contract.py
          ai/tests/test_cocolon_text_generation_core_analysis_composer.py
          ai/tests/test_analysis_environment_state_output_phase7.py
          ai/tests/test_analysis_environment_state_output_phase8_display_connection.py
          ai/tests/test_kokoro_weather_service.py
          ai/tests/test_kokoro_weather_phase6_qa.py
          ai/tests/test_analysis_home_summary_current_weather.py
          ai/tests/test_self_structure_watashi_map_payload.py
          ai/tests/test_analysis_saved_period.py
          ai/tests/test_analysis_observed_api.py
          ai/tests/test_analysis_observed_storage.py

