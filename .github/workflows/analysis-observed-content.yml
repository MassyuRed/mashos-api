# Synthetic Analysis content and save/read regression checks; no live credentials.
name: Analysis observed content

'on':
  push:
    branches:
      - agent/cmee-v1a-i1sx-source-explicit-20260815
    paths:
      - .github/workflows/analysis-observed-content.yml
      - ai/services/ai_inference/cocolon_meaning_experience_engine/**
      - ai/services/ai_inference/emlis_ai_grounded_observation_plan.py
      - ai/services/ai_inference/analysis_observed_service.py
      - ai/tests/test_cmee_analysis_v1d_vertical.py
      - ai/tests/test_cmee_analysis_nominal_relations.py
      - ai/tests/test_analysis_observed_storage.py
      - ai/tests/test_analysis_saved_period.py

permissions:
  contents: read

jobs:
  observed-content:
    if: github.repository == 'MassyuRed/mashos-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ai/services/ai_inference:ai/tests
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated-test dependencies
        run: >-
          python -m pip install --quiet --disable-pip-version-check
          pytest==8.4.1 pytest-subtests==0.14.2
          fastapi==0.142.2 pydantic==2.13.5 httpx==0.28.1
      - name: Record tested source and runtime
        run: |
          git rev-parse HEAD
          python --version
          python -m pip freeze
      - name: Verify Analysis generation and saved read
        run: >-
          python -m pytest -q --tb=short -ra
          -p pytest_subtests.plugin -p no:cacheprovider -c /dev/null --noconftest
          ai/tests/test_cmee_analysis_v1d_vertical.py
          ai/tests/test_cmee_analysis_nominal_relations.py
          ai/tests/test_analysis_observed_storage.py
          ai/tests/test_analysis_saved_period.py
      - name: Read synthetic Analysis content
        run: |
          python - <<'PY'
          from test_cmee_analysis_v1d_vertical import OWNER, record, request
          from cocolon_meaning_experience_engine.engine import MeaningExperienceEngine
          cases = (
              '私は資料を調べた。その後、私は同僚と分担を決めませんでした。それから、私は安心した。',
              '私は資料を調べた。その後、私は同僚と分担を決めておきませんでした。それから、私は安心した。',
              '私は同僚との分担を決めませんでした。それから、私は嬉しかった。',
              '私は資料を調べた。その後、私は分担を決めませんでした。不明な出来事があった。それから、私は安心した。',
          )
          for memo in cases:
              result = MeaningExperienceEngine().generate(request(record(memo=memo)))
              assert result.artifact is not None
              print('INPUT:', memo)
              print(result.artifact.safe_text_projection(authenticated_owner_scope=OWNER)['text'])
              projection = result.artifact.safe_projection(authenticated_owner_scope=OWNER)
              print('GRAPH:', len(projection['nodes']), 'nodes', len(projection['edges']), 'edges')
          PY
