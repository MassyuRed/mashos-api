name: CMEE Map and DeepInsight focused verification

'on':
  push:
    branches:
      - agent/cmee-map-piece-focused-check-20261128
    paths:
      - .github/workflows/analysis-observed-content.yml

permissions:
  contents: read

jobs:
  observed-content:
    if: github.repository == 'MassyuRed/mashos-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .:ai/services:ai/services/ai_inference:ai/tests:ai/tests/piece_v2
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated-test dependencies
        run: >-
          python -m pip install --quiet --disable-pip-version-check
          pytest==8.4.1 pytest-subtests==0.14.2 pytest-asyncio==1.2.0 numpy==2.3.5
          fastapi==0.142.2 pydantic==2.13.5 httpx==0.28.1 PyJWT==2.13.0 tornado==6.5.2
          -r ai/tools/analysis_semantic_generation_requirements.txt
      - name: Record tested source and runtime
        run: |
          git rev-parse HEAD
          python --version
          python -m pip freeze
      - name: Set up Node for existing PostgreSQL test harness
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install PostgreSQL WASM test dependency
        run: npm install --prefix "$RUNNER_TEMP/analysis-postgres" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify the Map and DeepInsight regressions
        env:
          Q2_PGLITE_MODULE: ${{ runner.temp }}/analysis-postgres/node_modules/@electric-sql/pglite
        run: >-
          python -m pytest -q --tb=short -ra
          -p pytest_subtests.plugin -p pytest_asyncio.plugin -p no:cacheprovider -c /dev/null --rootdir=. --noconftest
          ai/tests/test_analysis_primary_structures.py
          ai/tests/test_deep_insight.py
          ai/tests/test_analysis_deep_insight_handoff.py
          ai/tests/piece_v2/test_piece_deep_insight_http_lifecycle.py
