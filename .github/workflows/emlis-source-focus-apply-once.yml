name: Apply validated Emlis source focus once
on:
  push:
    branches: [agent/emlis-hypothesis-work-20260918]
    paths: [.github/workflows/emlis-source-focus-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'MassyuRed/mashos-api' && github.ref == 'refs/heads/agent/emlis-hypothesis-work-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd517b9d38cc3afae01a1849da375bc177d9abaf
      - name: Apply exact public source and existing handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'MassyuRed/mashos-api'
          base = 'bd517b9d38cc3afae01a1849da375bc177d9abaf'
          target = 'refs/heads/agent/cmee-v1a-i1sx-source-explicit-20260815'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def fetch_blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              assert result['encoding'] == 'base64'
              data = base64.b64decode(result['content'])
              assert blob(data) == sha, 'transfer blob mismatch'
              return data
          assert git('rev-parse', 'HEAD') == base
          assert git('ls-remote', 'origin', target).split()[0] == base, 'target changed; no overwrite'
          chunks = [
              '9df6962b06287176653c9dd7f0a94ab4c85a5e46',
              'fe33ea89149699c0113799a360532af5d545bcfd',
              '2bc8eab38c1bb23a9e941068b9df0bd36903b043',
              '5ceb48935d85ac8a124e1e57c8c11f116018e0cb',
              '4c9a89d66bec0315966174a97cac8c0d8158ac15',
              'd5b5b2c2684c3b11112032dc90822346fe07ac07',
              '7f9139465ed67c8120ce5f23826b0592e5260fe2',
          ]
          compressed = b''.join(fetch_blob(sha) for sha in chunks)
          assert len(compressed) == 6451 and blob(compressed) == 'a5912af811a16e161e9ecdde14685f2d1c585676'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '0ff06d03333c0121d7676cdbaef61b16de01239121a53a3bc971bed6063ed035'
          expected = {
              'ai/services/ai_inference/cocolon_meaning_experience_engine/emlis_stage1_response.py': ('2cc51c970b613b589a139987e7f25cf9316a9bdb','ae752357385447b7606a2898392aa630b2a5f07e'),
              'ai/services/ai_inference/emlis_ai_grounded_observation_gate.py': ('949f752cc1e47e993e4fb7057f1e07ebb95275b4','cfc6108e08996e2a78e95bbda0c89e2cdaf72a06'),
              'ai/tests/test_cmee_emlis_source_owned_focus.py': ('34f866d00c0d0b35d9e0247d31d1e5e2192fe1cb','582100bc9cf5a1f9da04714efe0fabec1111faae'),
              'ai/tests/fixtures/cmee_emlis_q1_shared_owner_identity_v1.json': ('7106cc0d6a19ba53d80837c076903bc6a48a2575','33d3cd2fec5e472b1aaa354ce0a7050054180128'),
              'ai/docs/CMEE_V1A_I1SX_CurrentStateAndNextWorkHandoff_20260816.md': ('85371f4be45e9599819504d9802f2adb5563c96a','fecd9f03d244a3b236e5c846d9bb977bbe077f44'),
          }
          for name, (before, after) in expected.items():
              assert blob(pathlib.Path(name).read_bytes()) == before, name
          patch_path = pathlib.Path('/tmp/emlis-public-qualified-revision.patch')
          patch_path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(patch_path)], check=True)
          subprocess.run(['git','apply',str(patch_path)], check=True)
          for name, (before, after) in expected.items():
              assert blob(pathlib.Path(name).read_bytes()) == after, name
          subprocess.run(['git','add','--',*expected], check=True)
          assert set(git('diff','--cached','--name-only').splitlines()) == set(expected)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix(emlis): realize qualified revisions through disjoint source duties',
              '-m','Keep required original-event context without duplicating corrected-feeling and independent-action contributions. Bind the full qualified event/time/feeling object in the existing independent inverse. Selected final validation: 1826 passed / 299 failed of 2125; all 2081 inherited outcomes unchanged, 44 new regressions fail before and pass after. Same100 full outcomes unchanged at 74 generated / 26 unavailable. Existing saved33 cases /45 states: three revised states gain current prose, 42 states unchanged, 78 GET and 33 no-author restart equalities. No full inherited 231/461 replay or whole-suite GREEN claimed. Repetitive observation and stock follow-up remain NOT_CLEAR. No API, DB, RN, deployment, external AI, threshold or fixed-expectation change.'], check=True)
          assert git('rev-parse','HEAD^') == base
          for name, (_, after) in expected.items():
              assert git('rev-parse','HEAD:'+name) == after, name
          assert git('ls-remote','origin',target).split()[0] == base, 'target advanced; keep candidate only'
          subprocess.run(['git','push','origin','HEAD:'+target], check=True)
          result = {'commit':git('rev-parse','HEAD'),'parent':base,'files':{name:after for name,(_,after) in expected.items()}}
          assert git('ls-remote','origin',target).split()[0] == result['commit']
          print(json.dumps(result, indent=2))
          PY
