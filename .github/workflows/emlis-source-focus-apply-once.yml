name: Apply validated Emlis source focus once
on:
  push:
    branches: [agent/emlis-hypothesis-work-20260918]
    paths: [.github/workflows/emlis-source-focus-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'MassyuRed/mashos-api' && github.ref == 'refs/heads/agent/emlis-hypothesis-work-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 879f292053c4b6eb531433b54b8504d2228ec38c
      - name: Apply exact public source and existing handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'MassyuRed/mashos-api'
          base = '879f292053c4b6eb531433b54b8504d2228ec38c'
          target = 'refs/heads/agent/cmee-v1a-i1sx-source-explicit-20260815'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def fetch_blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              assert result['encoding'] == 'base64'
              data = base64.b64decode(result['content'])
              assert blob(data) == sha, 'transfer blob mismatch'
              return data
          assert git('rev-parse', 'HEAD') == base
          assert git('ls-remote', 'origin', target).split()[0] == base, 'target changed; no overwrite'
          chunks = [
              '690a43cb877e13b58bf36cfb654287543a5d526b',
              'c4ff9d95c4dfc262db2a00f5ebf40e9b90f6584a',
              '96d21bb2d8083a6c5d2c6b16a8494ac48dc3468c',
              '86a09ffdd18c1134e0c7c45d4e0ea0195708a3c2',
              '564d5bd66ce7d55c2c8c341748e72a4157ca9bec',
              'b59497fbdd86922aff1759c94f44c5d7fbefbdc1',
              '28c79550a8908788ee13d324e1c377c4acf65f08',
          ]
          compressed = b''.join(fetch_blob(sha) for sha in chunks)
          assert len(compressed) == 8312 and blob(compressed) == '96bec892560dec6c228e24677e4c708df2930614'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '7841912836840b53298d79fbf4f412dd4c9d081504aba0ed57c4a42df10a2006'
          expected = {
              'ai/services/ai_inference/emlis_ai_grounded_observation_gate.py': ('164fa1f7001aef3dd3af13e8b180d6fe329869bf','949f752cc1e47e993e4fb7057f1e07ebb95275b4'),
              'ai/services/ai_inference/emlis_ai_grounded_observation_plan.py': ('bbae789ad4c853da4af83e27027a8613157be412','9c407b7c025453eb9c2ebef8257cd82a0f450258'),
              'ai/tests/fixtures/cmee_emlis_q1_shared_owner_identity_v1.json': ('540d26affc60bd066ab2922490829b7b3396d686','7106cc0d6a19ba53d80837c076903bc6a48a2575'),
              'ai/tests/test_cmee_emlis_source_owned_focus.py': ('d43f7126a6f5fcf5509e9639bb40986c32d94899','34f866d00c0d0b35d9e0247d31d1e5e2192fe1cb'),
              'ai/docs/CMEE_V1A_I1SX_CurrentStateAndNextWorkHandoff_20260816.md': ('2b528445f8c160414d5de726c91bac11f760b5ec','85371f4be45e9599819504d9802f2adb5563c96a'),
          }
          for name, (before, after) in expected.items():
              assert blob(pathlib.Path(name).read_bytes()) == before, name
          patch_path = pathlib.Path('/tmp/emlis-public-independent-context.patch')
          patch_path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(patch_path)], check=True)
          subprocess.run(['git','apply',str(patch_path)], check=True)
          for name, (before, after) in expected.items():
              assert blob(pathlib.Path(name).read_bytes()) == after, name
          subprocess.run(['git','add','--',*expected], check=True)
          assert set(git('diff','--cached','--name-only').splitlines()) == set(expected)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix(emlis): keep independent original fields out of asserted background',
              '-m','Publish the five unchanged files validated in the preceding private work session. Preserve explicit same-field and required relations, independent reception and inverse affirmative-act checks. Inherited selected validation: 1782 passed / 299 failed of 2081, new 68 passed; same100 unchanged at 74 generated / 26 unavailable; saved33 cases / 45 states with 21 changed, 24 unchanged, 78 GET and 33 restart equalities. This transfer does not rerun or upgrade those results. Repetition and three corrected states without current prose remain NOT_CLEAR; full inherited 231/461 replay incomplete. No API, DB, RN, deployment, external AI or fixed-expectation change.'], check=True)
          assert git('rev-parse','HEAD^') == base
          for name, (_, after) in expected.items():
              assert git('rev-parse','HEAD:'+name) == after, name
          assert git('ls-remote','origin',target).split()[0] == base, 'target advanced; keep candidate only'
          subprocess.run(['git','push','origin','HEAD:'+target], check=True)
          result = {'commit':git('rev-parse','HEAD'),'parent':base,'files':{name:after for name,(_,after) in expected.items()}}
          assert git('ls-remote','origin',target).split()[0] == result['commit']
          print(json.dumps(result, indent=2))
          PY
