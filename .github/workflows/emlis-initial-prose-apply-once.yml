name: Apply initial reception prose once
on:
  push:
    branches: [agent/emlis-hypothesis-work-20260918]
    paths: [.github/workflows/emlis-initial-prose-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'MassyuRed/mashos-api' && github.ref == 'refs/heads/agent/emlis-hypothesis-work-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 745873107166dd9ccb15e2e6f6fb82934b16ea01
      - name: Transfer public source only; no private evaluation
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          BASE='745873107166dd9ccb15e2e6f6fb82934b16ea01'
          TARGET='agent/cmee-v1a-i1sx-source-explicit-20260815'
          FILES={
            'ai/services/ai_inference/cocolon_meaning_experience_engine/emlis_v1a.py':('70eb464dfeb0f70effa744e518070a10de0f2881','5953dee52efe8081c066841394912b1a26db1a90'),
            'ai/services/ai_inference/emlis_ai_grounded_human_reception.py':('ec7c3c8f1807d9fb949ef0315cef682e7017810c','b905e9b65976739c3ce376d0ce851b3b3b94e4bf'),
            'ai/services/ai_inference/emlis_ai_grounded_observation_gate.py':('ad441d7169cec0e10429df2ad62d40451067d184','1f98a0a6b572c31c97d34849f9910addf7f111ea'),
            'ai/services/ai_inference/emlis_ai_grounded_observation_plan.py':('8040aaea8db3a97a2b2d71d7189517da2c0fe2a8','03dddaa7595b1e78b679825d68c465c7cc76ae5f'),
            'ai/tests/fixtures/cmee_emlis_q1_shared_owner_identity_v1.json':('387af2be92957c1c9311ad45d1b49b04deccb3c2','07f2949ae5477894a5e3e890e58077b5d7e85c3f'),
            'ai/tests/test_cmee_emlis_initial_received_discourse.py':(None,'b417d42b13f67df7ed1f3f07a04780e5f935932d')}
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          def blob(p):
              data=pathlib.Path(p).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert git('rev-parse','HEAD')==BASE
          assert git('ls-remote','origin','refs/heads/'+TARGET).split()[0]==BASE,'Product head drift; no overwrite'
          for path,(before,after) in FILES.items():
              assert (blob(path) if pathlib.Path(path).exists() else None)==before,path
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='561d5f698e338970754b6429e6d67586cf78689422e792b3028b67a5781931b1','Transport bytes differ'
          path=pathlib.Path('/tmp/emlis-public-source.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--whitespace=error',str(path)],check=True)
          for path,(_,after) in FILES.items():assert blob(path)==after,path
          subprocess.run(['git','add','--',*FILES],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(FILES)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix(emlis): realize source-owned initial experience relations','-m','Use the existing sole received-discourse author before an answer, with independent body reading and original scope preservation. Support one to three Q3 event/reaction groups; keep the legacy original-source multi-group contract unchanged. Four implementation owners, one current derived identity fixture and 51 public synthetic checks. New51 and shared-boundary76 pass; inherited targeted163 retain160pass/3fail. Larger interrupted impact run records14 additional old-text/old-reader incompatibilities; expectations unchanged. Same100 inputs, bodies, availability and meaning remain unchanged. Product NOT_CLEAR, Draft/defaultOFF, no deployment, external AI or private evaluation in Actions.')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+TARGET],check=True)
          print('PUBLIC_SOURCE_COMMIT='+git('rev-parse','HEAD'))
          print('PUBLIC_SOURCE_TREE='+git('rev-parse','HEAD^{tree}'))
          PY
