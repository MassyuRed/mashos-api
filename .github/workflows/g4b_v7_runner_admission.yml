name: g4b-v7-runner-admission
on:
  push:
    branches:
      - agent/g4b-v7-runner-admission
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify fixed non-root transition and frozen interpreter
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/g4b-runtime"
          archive="$RUNNER_TEMP/python.tar.gz"
          curl --fail --location --silent --show-error             'https://github.com/astral-sh/python-build-standalone/releases/download/20260303/cpython-3.12.13%2B20260303-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'             --output "$archive"
          echo 'c710dd6b63e4df92f4c5b7b29ccad4276226a024a9017d5018f15321c7854af4  '"$archive" | sha256sum --check -
          mkdir "$runtime_dir"
          tar -xzf "$archive" -C "$runtime_dir"
          "$runtime_dir/python/bin/python3.12" --version
          sha256sum "$runtime_dir/python/bin/python3.12"
          sudo -n "$runtime_dir/python/bin/python3.12" - <<'PY'
          import json
          import os
          result = {
              "euid_before": os.geteuid(),
              "egid_before": os.getegid(),
              "setgroups_policy": open("/proc/self/setgroups", encoding="ascii").read().strip(),
              "uid_map": open("/proc/self/uid_map", encoding="ascii").read().strip(),
              "gid_map": open("/proc/self/gid_map", encoding="ascii").read().strip(),
          }
          os.setgroups([])
          os.setresgid(65534, 65534, 65534)
          os.setresuid(65534, 65534, 65534)
          result.update({
              "resuid_after": os.getresuid(),
              "resgid_after": os.getresgid(),
              "groups_after": os.getgroups(),
          })
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          if result["resuid_after"] != (65534, 65534, 65534):
              raise SystemExit(81)
          if result["resgid_after"] != (65534, 65534, 65534):
              raise SystemExit(82)
          if result["groups_after"] != []:
              raise SystemExit(83)
          PY
