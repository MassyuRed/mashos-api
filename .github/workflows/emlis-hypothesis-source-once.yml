name: Export exact Emlis source once
on:
  push:
    branches: [agent/emlis-hypothesis-work-20260918]
    paths: [.github/workflows/emlis-hypothesis-source-once.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e1623f222b0bc98a75bfae2b5ed21bd99200797
          path: api
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MassyuRed/Cocolon
          ref: refs/pull/30/head
          path: app
          persist-credentials: false
      - name: Export code and text; execute no product or private evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          python3 - <<'PY'
          import subprocess,pathlib,tarfile,json
          out=pathlib.Path('out')
          extensions={'.py','.json','.md','.txt','.sh','.js','.ts','.tsx','.yml','.yaml','.lock','.toml','.ini','.cfg','.sql','.csv'}
          for name in ('api','app'):
              root=pathlib.Path(name)
              git=lambda *a: subprocess.check_output(['git','-c','core.quotepath=false','-C',name,*a]).decode().strip()
              (out/(name+'.commit')).write_text(git('rev-parse','HEAD'))
              (out/(name+'.tree')).write_text(git('rev-parse','HEAD^{tree}'))
              rows=[]
              with tarfile.open(out/(name+'.tar.gz'),'w:gz') as archive:
                  for entry in git('ls-tree','-r','HEAD').splitlines():
                      meta,path=entry.split('\t',1);mode,kind,sha=meta.split()
                      if kind!='blob':continue
                      p=root/path
                      if name=='api' or p.suffix in extensions:
                          archive.add(p,arcname=path,recursive=False)
                          rows.append({'path':path,'sha':sha,'mode':mode})
              (out/(name+'.manifest.json')).write_text(json.dumps(rows,ensure_ascii=False))
          PY
          sha256sum out/*.tar.gz > out/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: emlis-hypothesis-public-source
          path: out/
          retention-days: 3
